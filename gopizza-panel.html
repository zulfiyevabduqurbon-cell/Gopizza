<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoPizza Panel</title>
<style>
:root{--bg:#f6f9f1;--surface:#fff;--ink:#1d1a2b;--muted:#6b6678;--brand:#17874a;--tomato:#d63a22;--yellow:#ffc845;--line:#dbe8d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#17141f;--surface:#241f31;--ink:#fff4d6;--muted:#a9a2b8;--line:#382f4a;--tomato:#ff8a6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
header{background:#fff;color:#1d1a2b;border-bottom:3px solid var(--brand);height:62px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--brand)}
.logo{height:34px;width:auto;display:block}
header small{color:#6b6678;font-size:12px}
.card[data-s="new"]{border-color:var(--tomato)}
.lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.lock .logo{height:56px}
.lock input{width:min(280px,100%);padding:13px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px inherit;text-align:center}
.lock button{width:min(280px,100%);background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;font:800 17px inherit;cursor:pointer}
#pe{color:var(--tomato);margin:0;min-height:1.4em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.tab{flex:none;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font:700 14px inherit;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{max-width:760px;margin:0 auto;padding:0 16px 40px;display:grid;gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px}
.top{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}
.muted{color:var(--muted);font-size:14px}
.items{margin:8px 0;font-size:15px}
.next{width:100%;margin-top:10px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;font:800 16px inherit;cursor:pointer}
.next:disabled{opacity:.5}
a{color:inherit}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.err{background:var(--yellow);color:#1d1a2b;padding:10px 16px;font-weight:700;display:none}
</style>
</head>

<div class="err" id="err"></div>
<div class="tabs" id="tabs"></div>
<main id="list"></main>
<script>
const FB={project:"gopizzadem",key:""};
const API="https://firestore.googleapis.com/v1/projects/"+FB.project+"/databases/(default)/documents/orders";
const k=q=>(q?"?"+q:"")+(FB.key?(q?"&":"?")+"key="+FB.key:"");
const TABS=[["new","Yangi"],["preparing","Tayyorlanmoqda"],["delivering","Yo’lda"],["done","Yetkazildi"]];
const NEXT={new:["preparing","Tayyorlanmoqda deb belgilash"],preparing:["delivering","Yo’lda deb belgilash"],delivering:["done","Yetkazildi deb belgilash"]};
const fmt=n=>Number(n).toLocaleString("ru-RU").replace(/\u00a0/g," ")+" so’m";
let tab="new",orders=[],lastNew=-1,ctx;
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();o.connect(ctx.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),350)}catch(e){}}
function err(m){$("err").textContent=m;$("err").style.display=m?"block":"none"}
async function load(){
  if(FB.project.startsWith("FIREBASE_")){err("Firebase loyiha ID si kiritilmagan.");$("sub").textContent="";return}
  try{
    const r=await fetch(API+k("pageSize=200"));
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    orders=(j.documents||[]).map(d=>{const f=d.fields;return{id:d.name.split("/").pop(),no:f.no.integerValue,items:f.items.stringValue,total:f.total.integerValue,addr:f.addr.stringValue,tel:f.tel.stringValue,status:f.status.stringValue,at:Number(f.createdAt.integerValue)}}).sort((a,b)=>b.at-a.at);
    err("");
    const n=orders.filter(o=>o.status==="new").length;
    if(lastNew>=0&&n>lastNew)beep();
    lastNew=n;document.title=(n?"("+n+") ":"")+"GoPizza — Panel";
    $("sub").textContent="Yangilandi: "+new Date().toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    render()}catch(e){err("Ulanib bo’lmadi. Internet va Firebase sozlamalarini tekshiring.")}}
function render(){
  $("tabs").innerHTML=TABS.map(([s,l])=>`<button class="tab" aria-pressed="${s===tab}" data-t="${s}">${l} (${orders.filter(o=>o.status===s).length})</button>`).join("");
  const rows=orders.filter(o=>o.status===tab);
  $("list").innerHTML=rows.length?rows.map(o=>`<div class="card" data-s="${o.status}"><div class="top"><span>#${o.no}</span><span>${fmt(o.total)}</span></div>
  <div class="muted">${new Date(o.at).toLocaleString("uz-UZ",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"})}</div>
  <div class="items">${esc(o.items)}</div>
  <div>📍 ${esc(o.addr)}</div><div>📞 <a href="tel:${esc(o.tel)}">${esc(o.tel)}</a></div>
  ${NEXT[o.status]?`<button class="next" data-id="${o.id}" data-s="${NEXT[o.status][0]}">${NEXT[o.status][1]}</button>`:""}</div>`).join(""):`<div class="empty">Bu bo’limda buyurtma yo’q.</div>`}
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.dataset.t){tab=t.dataset.t;render()}
  if(t.dataset.id){
    t.disabled=true;
    try{
      const r=await fetch(API+"/"+t.dataset.id+k("updateMask.fieldPaths=status"),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{status:{stringValue:t.dataset.s}}})});
      if(!r.ok)throw new Error();
      await load()}catch(x){err("Holatni o’zgartirib bo’lmadi. Qayta urinib ko’ring.");t.disabled=false}}
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(x){}});
const PIN="1234";
function start(){$("lock").style.display="none";try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(x){}load();setInterval(load,5000)}
try{if(localStorage.getItem("gp_ok")===PIN)start()}catch(x){}
$("unlock").addEventListener("click",()=>{
  if($("pin").value===PIN){try{localStorage.setItem("gp_ok",PIN)}catch(x){}start()}
  else $("pe").textContent="PIN noto’g’ri."});
</script>
</body>
</html>
