<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoPizza — pitsa buyurtmasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f9f1;--surface:#ffffff;--ink:#1d1a2b;--muted:#6b6678;--brand:#17874a;--tomato:#d63a22;--yellow:#ffc845;--line:#dbe8d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--surface:#241f31;--ink:#fff4d6;--muted:#a9a2b8;--line:#382f4a;--tomato:#ff8a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141f;--surface:#241f31;--ink:#fff4d6;--muted:#a9a2b8;--line:#382f4a;--tomato:#ff8a6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:800;margin:0}
header{background:#fff;color:#1d1a2b;border-bottom:3px solid var(--brand);height:62px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:10}
.logo{height:38px;width:auto;display:block}
.cartbtn{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:800 15px "Nunito Sans",sans-serif;cursor:pointer}
.hero{background:var(--yellow);color:#1d1a2b;padding:22px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.hero h1{font-size:clamp(26px,6vw,42px);line-height:1.05;max-width:11ch}
.hero p{margin:8px 0 0;font-weight:600}
.hero img{height:92px;width:auto;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--bg);z-index:4}
.tab{flex:none;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font:800 14px "Nunito Sans",sans-serif;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{max-width:980px;margin:0 auto;padding:0 16px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.item{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column}
.pic{font-size:64px;text-align:center;background:var(--bg);border-radius:12px;padding:10px 0;margin-bottom:10px}
.item h3{font-size:17px}
.item p{color:var(--muted);font-size:14px;margin:4px 0 12px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:800;color:var(--tomato)}
.add{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:800 14px "Nunito Sans",sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.scrim.on{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.lines{flex:1;overflow:auto;margin:12px 0}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .e{font-size:30px}
.line .n{flex:1;font-weight:700}
.line .n small{display:block;color:var(--muted);font-weight:400}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:800;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:10px}
.order{width:100%;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:14px;font:800 17px "Nunito Sans",sans-serif;cursor:pointer}
.order:disabled{opacity:.4;cursor:not-allowed}
.field{width:100%;padding:11px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:16px "Nunito Sans",sans-serif;margin-bottom:8px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.done{text-align:center;padding:30px 0}
.done .big{font-size:72px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 18px;display:none;justify-content:space-between;align-items:center;font-weight:800;cursor:pointer;z-index:6;max-width:600px;margin:0 auto}
.bar.on{display:flex}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>

const fmt=n=>n.toLocaleString("ru-RU").replace(/\u00a0/g," ")+" so’m";
const MENU=[
{id:1,c:"Pitsa",e:"🍕",n:"Margarita",d:"Pomidor sousi, mozzarella, rayhon",p:45000},
{id:2,c:"Pitsa",e:"🍕",n:"Pepperoni",d:"Pikant kolbasa va mozzarella",p:58000},
{id:3,c:"Pitsa",e:"🧀",n:"To’rt pishloq",d:"Mozzarella, parmezan, chedder, dor blyu",p:62000},
{id:4,c:"Pitsa",e:"🍗",n:"Tovuqli BBQ",d:"Tovuq filesi, BBQ sous, piyoz",p:59000},
{id:5,c:"Pitsa",e:"🥩",n:"Go’shtli",d:"Mol go’shti, bolgar qalampiri, zaytun",p:65000},
{id:6,c:"Pitsa",e:"🍄",n:"Qo’ziqorinli",d:"Shampinyon, pishloq, ko’katlar",p:52000},
{id:7,c:"Pitsa",e:"🌶️",n:"Achchiq",d:"Jalapeno, pepperoni, achchiq sous",p:56000},
{id:8,c:"Kombo",e:"🎉",n:"Ikkitalik kombo",d:"2 ta o’rta pitsa va 2 ta ichimlik",p:110000},
{id:9,c:"Kombo",e:"🍱",n:"Yakka kombo",d:"Pitsa bo’lagi 3 ta, fri va ichimlik",p:48000},
{id:10,c:"Gazak",e:"🍟",n:"Fri kartoshka",d:"Katta porsiya",p:15000},
{id:11,c:"Gazak",e:"🧀",n:"Pishloqli tayoqchalar",d:"Sous bilan, 6 dona",p:22000},
{id:12,c:"Gazak",e:"🥗",n:"Yangi salat",d:"Pomidor, bodring, ko’katlar",p:14000},
{id:13,c:"Ichimlik",e:"🥤",n:"Kola 0.5 l",d:"Muzdek",p:9000},
{id:14,c:"Ichimlik",e:"🍋",n:"Limonad",d:"Uy retsepti bo’yicha",p:12000},
{id:15,c:"Shirinlik",e:"🍰",n:"Chizkeyk",d:"Klassik, qulupnay sousi bilan",p:24000}
];
const cats=["Hammasi",...new Set(MENU.map(m=>m.c))];
let cat="Hammasi",cart={},done=false,orderNo=0;
let orderId=null,status="new",timer=null;
const FB={project:"gopizzadem",key:""};
const fbUrl=p=>"https://firestore.googleapis.com/v1/projects/"+FB.project+"/databases/(default)/documents/"+p+(FB.key?"?key="+FB.key:"");
const STEPS={new:["Qabul qilindi","🧾"],preparing:["Tayyorlanmoqda","👨‍🍳"],delivering:["Yo’lda","🛵"],done:["Yetkazildi","✅"]};
async function sendOrder(addr,tel){
  const {s}=totals();
  const items=Object.keys(cart).map(id=>{const m=MENU.find(x=>x.id==id);return m.n+" × "+cart[id]}).join(", ");
  const no=Math.floor(1000+Math.random()*9000);
  if(FB.project.startsWith("FIREBASE_"))return {no:no,id:null};
  const body={fields:{no:{integerValue:String(no)},items:{stringValue:items},total:{integerValue:String(s)},addr:{stringValue:addr},tel:{stringValue:tel},status:{stringValue:"new"},createdAt:{integerValue:String(Date.now())}}};
  const r=await fetch(fbUrl("orders"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("fb");
  const j=await r.json();
  return {no:no,id:j.name.split("/").pop()}}
function poll(){
  clearInterval(timer);if(!orderId)return;
  timer=setInterval(async()=>{try{
    const r=await fetch(fbUrl("orders/"+orderId));const j=await r.json();
    const st=j.fields.status.stringValue;
    if(st!==status){status=st;if(done)renderCart()}
    if(st==="done")clearInterval(timer)}catch(e){}},6000)}
const $=id=>document.getElementById(id);
function renderTabs(){$("tabs").innerHTML=cats.map(c=>`<button class="tab" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("")}
function renderGrid(){
  $("grid").innerHTML=MENU.filter(m=>cat==="Hammasi"||m.c===cat).map(m=>`
  <article class="item"><div class="pic" aria-hidden="true">${m.e}</div>
  <h3>${m.n}</h3><p>${m.d}</p>
  <div class="row"><span class="price">${fmt(m.p)}</span><button class="add" data-a="${m.id}">Qo’shish</button></div></article>`).join("")}
function totals(){let n=0,s=0;for(const id in cart){n+=cart[id];s+=cart[id]*MENU.find(m=>m.id==id).p}return{n,s}}
function renderCart(){
  const {n,s}=totals();$("cnt").textContent=n;
  $("bar").classList.toggle("on",n>0&&!$("drawer").classList.contains("on"));
  $("barTxt").textContent=n+" ta mahsulot · "+fmt(s);
  if(done){
    $("lines").innerHTML=`<div class="done"><div class="big">${STEPS[status][1]}</div><h2>${STEPS[status][0]}</h2><p>Buyurtma raqami: #${orderNo}</p><p>Holat o’zgarsa, shu yerda ko’rinadi.</p></div>`;
    $("foot").innerHTML=`<button class="order" id="again">Yangi buyurtma</button>`;return}
  const ids=Object.keys(cart);
  $("lines").innerHTML=ids.length?ids.map(id=>{const m=MENU.find(x=>x.id==id);return `<div class="line"><span class="e">${m.e}</span>
  <div class="n">${m.n}<small>${fmt(m.p*cart[id])}</small></div>
  <div class="qty"><button data-m="${id}" aria-label="Kamaytirish">−</button><b>${cart[id]}</b><button data-p="${id}" aria-label="Ko’paytirish">+</button></div></div>`}).join("")
  :`<div class="empty">Savat bo’sh. Menyudan biror narsa tanlang.</div>`;
  $("foot").innerHTML=`<div class="total"><span>Jami</span><span>${fmt(s)}</span></div>
  <input class="field" id="addr" placeholder="Yetkazib berish manzili">
  <input class="field" id="tel" type="tel" placeholder="Telefon raqami">
  <button class="order" id="go" ${n?"":"disabled"}>Buyurtma berish</button>`}
function open(v){$("drawer").classList.toggle("on",v);$("scrim").classList.toggle("on",v);if(!v&&done){done=false}renderCart()}
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.dataset.c){cat=t.dataset.c;renderTabs();renderGrid()}
  if(t.dataset.a){cart[t.dataset.a]=(cart[t.dataset.a]||0)+1;renderCart()}
  if(t.dataset.p){cart[t.dataset.p]++;renderCart()}
  if(t.dataset.m){if(--cart[t.dataset.m]<=0)delete cart[t.dataset.m];renderCart()}
  if(t.id==="go"){
    if(!$("addr").value.trim()||!$("tel").value.trim()){alert("Manzil va telefon raqamini kiriting.");return}
    t.disabled=true;t.textContent="Yuborilmoqda...";
    try{const o=await sendOrder($("addr").value.trim(),$("tel").value.trim());orderNo=o.no;orderId=o.id;status="new"}
    catch(err){alert("Buyurtma yuborilmadi. Internetni tekshirib, qayta urinib ko’ring.");t.disabled=false;t.textContent="Buyurtma berish";return}
    cart={};done=true;renderCart();poll()}
  if(t.id==="again"){clearInterval(timer);orderId=null;done=false;open(false)}
  if(t.closest&&(t.closest("#bar")||t.id==="open"))open(true);
  if(t.id==="close"||t.id==="scrim")open(false)});
renderTabs();renderGrid();renderCart();
</script>
</body>
</html>
