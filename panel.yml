name: Build Panel APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor loyihasini tayyorlash
        run: |
          mkdir -p www
          cp panel.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "GoPizza Panel" uz.gopizza.panel --web-dir www
          npx cap add android
          mkdir -p assets
          cp icon-panel.png assets/icon.png
          npm install @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' || echo "Ikonka yaratilmadi"
          npx cap sync android
      - name: APK yigish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gopizza-panel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
